<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Space - Three.js</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
    #info {
      position: fixed;
      top: 12px;
      left: 12px;
      color: #fff;
      background: rgba(0,0,0,0.5);
      padding: 10px 14px;
      border-radius: 6px;
      font-family: monospace;
      font-size: 13px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="info"></div>
  <canvas id="c"></canvas>
  <script type="module" src="app.js"></script>
</body>
</html>
